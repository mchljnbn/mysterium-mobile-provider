name: Build custom APK

on:
  push:
    branches:
      - custom-build
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Mysterium node AAR
        uses: actions/cache@v4
        with:
          path: android/libs
          key: node-aar-${{ hashFiles('android/gradle/libs.versions.toml') }}

      - name: Verify release keystore
        working-directory: android
        run: |
          test -f keystore/release.keystore || {
            echo "Missing android/keystore/release.keystore"
            exit 1
          }

      # Uses the same existing release keystore and signing configuration as prior builds.
      - name: Write signing config
        working-directory: android
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_STORE_PASSWORD" || { echo "Missing RELEASE_STORE_PASSWORD secret"; exit 1; }
          test -n "$RELEASE_KEY_ALIAS" || { echo "Missing RELEASE_KEY_ALIAS secret"; exit 1; }
          test -n "$RELEASE_KEY_PASSWORD" || { echo "Missing RELEASE_KEY_PASSWORD secret"; exit 1; }
          cat > local.properties <<EOF
          releaseStoreFile=keystore/release.keystore
          releaseStorePassword=$RELEASE_STORE_PASSWORD
          releaseKeyAlias=$RELEASE_KEY_ALIAS
          releaseKeyPassword=$RELEASE_KEY_PASSWORD
          EOF

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK integrity
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK_PATH" || {
            echo "APK not found or empty: $APK_PATH"
            exit 1
          }
          APK_SIZE=$(wc -c < "$APK_PATH")
          echo "APK size: $APK_SIZE bytes"
          if [ "$APK_SIZE" -lt 1000000 ]; then
            echo "ERROR: APK is suspiciously small (< 1MB)"
            exit 1
          fi
          echo "APK integrity check passed"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mystnodes-custom-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
