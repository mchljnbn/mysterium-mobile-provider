name: Build custom APK

on:
  push:
    branches: [custom-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache Mysterium node AAR
        uses: actions/cache@v4
        with:
          path: android/libs
          key: node-aar-1.39.7

      # Upstream's build.gradle.kts reads optional release signing from
      # android/local.properties; the keystore is committed at
      # android/keystore/ on this branch for consistent personal builds.
      - name: Write signing config
        working-directory: android
        run: |
          cat > local.properties << EOF
          releaseStoreFile=keystore/release.keystore
          releaseStorePassword=mystnodes2026
          releaseKeyAlias=mystnodes
          releaseKeyPassword=mystnodes2026
          EOF

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK to transfer.sh (no sign-up)
        if: success()
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found at $APK_PATH"
            exit 1
          fi

          URL=$(curl --fail --silent --show-error --upload-file "$APK_PATH" "https://transfer.sh/mystnodes-provider-${{ github.run_number }}.apk")
          echo "APK_URL=$URL" >> "$GITHUB_ENV"
          echo "Download URL: $URL"
          echo "## APK Download" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mystnodes-custom-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
