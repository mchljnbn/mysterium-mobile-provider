
name: Build custom APK

on:
  push:
    branches:
      - custom-build
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custom-build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Mysterium node AAR
        uses: actions/cache@v4
        with:
          path: android/libs
          key: node-aar-1.39.6

      - name: Check existing signing keystore
        run: |
          if [ ! -f android/keystore/release.keystore ]; then
            echo "::error::Existing release keystore not found."
            echo "Restore the original keystore before building."
            exit 1
          fi

      - name: Write signing config
        working-directory: android
        shell: bash
        run: |
          cat > local.properties <<'EOF'
          releaseStoreFile=keystore/release.keystore
          releaseStorePassword=YOUR_EXISTING_KEYSTORE_PASSWORD
          releaseKeyAlias=YOUR_EXISTING_KEY_ALIAS
          releaseKeyPassword=YOUR_EXISTING_KEY_PASSWORD
          EOF

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          APK_SIZE=$(stat -c%s "$APK_PATH")
          echo "APK size: $APK_SIZE bytes"

          if [ "$APK_SIZE" -lt 1000000 ]; then
            echo "::error::APK is unexpectedly small."
            exit 1
          fi

          echo "APK integrity check passed."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mystnodes-custom-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          compression-level: 0
