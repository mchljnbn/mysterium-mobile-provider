name: Build custom APK

on:
  push:
    branches: [custom-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache Mysterium node AAR
        uses: actions/cache@v4
        with:
          path: android/libs
          key: node-aar-1.39.6

      - name: Write signing config
        working-directory: android
        run: |
          cat > local.properties << EOF
          releaseStoreFile=keystore/release.keystore
          releaseStorePassword=mystnodes2026
          releaseKeyAlias=mystnodes
          releaseKeyPassword=mystnodes2026
          EOF

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK to file.io (no sign-up, 14 days)
        if: success()
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found at $APK_PATH"
            exit 1
          fi

          echo "Uploading to file.io..."
          RESPONSE=$(curl -sS -L -F "file=@$APK_PATH" "https://file.io/?expires=14d")
          echo "$RESPONSE"

          DOWNLOAD_URL=$(echo "$RESPONSE" | grep -o 'https://[^"[:space:]]*' | head -n 1)

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "Upload failed. Response: $RESPONSE"
            exit 1
          fi

          echo "Download URL: $DOWNLOAD_URL"
          echo "## 📥 APK Download Link" >> "$GITHUB_STEP_SUMMARY"
          echo "[Click here to download APK]($DOWNLOAD_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "**Expires in 14 days**" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mystnodes-custom-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
